name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: VoiceAFK/pom.xml
      - run: mvn -B package
        working-directory: VoiceAFK
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAFK
          path: VoiceAFK/target/*.jar
